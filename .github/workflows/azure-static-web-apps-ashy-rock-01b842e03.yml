name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace homepage in package.json
        run: |
          sed -i 's|"homepage": "https://error505.github.io/error505"|"homepage": ""|' package.json

      - name: Update blog image paths to GitHub raw URLs
        run: |
          # Replace local blog image references with raw GitHub URLs in primary blogPosts.json
          if [ -f src/blogPosts.json ]; then
            sed -i "s|\"\.\/static\/images\/blog\/|\"https://raw.githubusercontent.com/error505/error505/main/static/images/blog/|g" src/blogPosts.json || true
          fi
          # Also adjust if a data copy exists
          if [ -f src/data/blogPosts.json ]; then
            sed -i "s|\"\.\/static\/images\/blog\/|\"https://raw.githubusercontent.com/error505/error505/main/static/images/blog/|g" src/data/blogPosts.json || true
          fi

      # Add build step that ignores lint errors
      - name: Install dependencies and Build
        run: |
          npm install
          CI=false npm run build

      - name: Remove blog images from build output
        run: |
          # Ensure blog image folder is not included in the artifact uploaded to Azure Static Web Apps
          rm -rf dist/static/images/blog || true
          rm -rf dist/public/static/images/blog || true

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_ROCK_01B842E03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          output_location: "dist" # Built app content directory - optional
          skip_app_build: true # Skip the internal build since we built it manually above
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_ROCK_01B842E03 }}
          action: "close"
