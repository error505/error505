name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace homepage in package.json
        run: |
          sed -i 's|"homepage": "https://error505.github.io/error505"|"homepage": ""|' package.json

      - name: Update blog image paths to GitHub raw URLs
        run: |
          # Replace local blog image references with raw GitHub URLs in primary blogPosts.json
          if [ -f src/blogPosts.json ]; then
            sed -i "s|\"\.\/static\/images\/blog\/|\"https://raw.githubusercontent.com/error505/error505/main/static/images/blog/|g" src/blogPosts.json || true
          fi
          # Also adjust if a data copy exists
          if [ -f src/data/blogPosts.json ]; then
            sed -i "s|\"\.\/static\/images\/blog\/|\"https://raw.githubusercontent.com/error505/error505/main/static/images/blog/|g" src/data/blogPosts.json || true
          fi

      # Add build step that ignores lint errors
      - name: Install dependencies and Build
        run: |
          npm install
          CI=false npm run build

      - name: Diagnose build size and remove blog images from build output
        run: |
          echo "--- Build size diagnostics (before cleanup) ---"
          if [ -d dist ]; then du -sh dist || true; fi
          if [ -d build ]; then du -sh build || true; fi
          if [ -d out ]; then du -sh out || true; fi
          echo "--- Top files (before cleanup) ---"
          if [ -d dist ]; then du -ah dist | sort -rh | head -n 50 || true; fi
          if [ -d build ]; then du -ah build | sort -rh | head -n 50 || true; fi

          # Aggressive cleanup: remove common static/image/video folders and build artifacts
          echo "--- Removing known large folders ---"
          rm -rf dist/static || true
          rm -rf dist/public || true
          rm -rf dist/assets/images || true
          rm -rf build/static || true
          rm -rf out/static || true

          # Remove source maps and media files which can bloat artifact size
          echo "--- Removing source maps and media files ---"
          find dist -type f -name "*.map" -print -delete || true
          find dist -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.avi" -o -iname "*.mkv" \) -print -delete || true

          # Remove any remaining very large files (>5MB)
          echo "--- Removing files larger than 5MB ---"
          find dist -type f -size +5M -print -exec rm -f {} \; || true

          echo "--- Removed files summary ---"
          if [ -d dist ]; then du -sh dist || true; fi
          if [ -d build ]; then du -sh build || true; fi
          if [ -d out ]; then du -sh out || true; fi

          # Remove blog image folder from common build output locations to reduce artifact size
          rm -rf dist/static/images/blog || true
          rm -rf dist/public/static/images/blog || true
          rm -rf dist/assets/static/images/blog || true
          rm -rf build/static/images/blog || true
          rm -rf out/static/images/blog || true

          echo "--- Build size diagnostics (after cleanup) ---"
          if [ -d dist ]; then du -sh dist || true; fi
          if [ -d build ]; then du -sh build || true; fi
          if [ -d out ]; then du -sh out || true; fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_ROCK_01B842E03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          output_location: "dist" # Built app content directory - optional
          skip_app_build: true # Skip the internal build since we built it manually above
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_ROCK_01B842E03 }}
          action: "close"
